name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  shift-left-checks:
    name: Shift-Left IaC & Static Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Hadolint Dockerfile Scan
        uses: hadolint/hadolint-action@f91fa57fc1ae9c1a051d6c6b31a5fc6a2b9a57f9
        with:
          dockerfile: ./app/Dockerfile
          failure-threshold: warning

      - name: Trivy IaC, Secret & Misconfiguration Gate
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret,misconfig'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Validate Frontend Assets
        run: |
          test -s app/index.html
          test -s app/styles.css
          test -s app/script.js
          node --check app/script.js

  build:
    name: Build Container Image
    runs-on: ubuntu-latest
    needs: shift-left-checks
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build image and export tar archive
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ./app
          file: ./app/Dockerfile
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          outputs: type=docker,dest=/tmp/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke Test Hardened Container (Non-Root & Security Headers)
        run: |
          docker run -d --rm --read-only \
            --tmpfs /tmp:rw,noexec,nosuid \
            --tmpfs /var/cache/nginx:rw,noexec,nosuid \
            --tmpfs /var/run:rw,noexec,nosuid \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            -p 8080:8080 \
            --name webapp-test \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          sleep 2
          CONTAINER_UID=$(docker exec webapp-test id -u)
          if [ "$CONTAINER_UID" -eq 0 ]; then
            echo "Container is running as root!"
            exit 1
          fi
          curl -fsS http://127.0.0.1:8080/healthz | grep -q "OK"
          curl -fsSI http://127.0.0.1:8080/ | grep -iq "X-Frame-Options: DENY"
          curl -fsSI http://127.0.0.1:8080/ | grep -iq "Content-Security-Policy"
          docker stop webapp-test

      - name: Upload image tar artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: container-image
          path: /tmp/image.tar
          retention-days: 1

  security-scan:
    name: Vulnerability Security Gate (Trivy)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Download image tar artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: container-image
          path: /tmp

      - name: Run Trivy Security Gate
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0
        with:
          input: /tmp/image.tar
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Generate Trivy SARIF report
        if: always()
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0
        with:
          input: /tmp/image.tar
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload SARIF report to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  sbom:
    name: Generate SBOM (CycloneDX)
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Download image tar artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: container-image
          path: /tmp

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610

      - name: Generate CycloneDX JSON SBOM
        env:
          SYFT_FILE_METADATA_SELECTION: "none"
        run: |
          syft /tmp/image.tar \
            --source-name "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" \
            --source-version "${{ github.sha }}" \
            -o cyclonedx-json=sbom.cdx.json

      - name: Upload SBOM as CI Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom.cdx.json
          path: sbom.cdx.json
          retention-days: 14

  grype:
    name: Scan SBOM with Grype & Trivy
    runs-on: ubuntu-latest
    needs: sbom
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sbom.cdx.json
          path: .

      - name: Scan SBOM with Trivy
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0
        with:
          scan-type: 'sbom'
          scan-ref: 'sbom.cdx.json'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Install Grype
        id: grype
        uses: anchore/scan-action/download-grype@1638637db639e0ade3258b51db49a9a137574c3e

      - name: Scan SBOM with Grype
        run: |
          ${{ steps.grype.outputs.cmd }} sbom:sbom.cdx.json \
            --fail-on high \
            --only-fixed \
            -o table \
            -o sarif=grype.sarif

      - name: Upload report as CI Artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: grype.sarif
          path: grype.sarif
          retention-days: 14

      - name: Upload Grype SARIF report to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b
        with:
          sarif_file: 'grype.sarif'
          category: 'grype-sbom-scan'
        continue-on-error: true
