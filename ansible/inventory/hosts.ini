# Вузли керування та автоматизації
[control_nodes]
Study3-setup ansible_host=192.168.5.103

# Вузли середовища Kubernetes / Minikube
[k8s_nodes]
Study3-minikube ansible_host=192.168.5.104

# Вузли моніторингу та збору метрик і логів
[monitoring_nodes]
Study3-observability ansible_host=192.168.5.105

# Загальні змінні підключення для всіх хостів
[all:vars]
ansible_user=devops
ansible_ssh_private_key_file=~/.ssh/study3_devsecops_key
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
