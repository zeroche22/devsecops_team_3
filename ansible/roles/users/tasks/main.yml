---
- name: Перевірка наявності групи sudo
  group:
    name: sudo
    state: present

- name: Створення користувача devops
  user:
    name: devops
    shell: /bin/bash
    groups: sudo
    append: yes
    state: present

- name: Створення користувача dev
  user:
    name: dev
    shell: /bin/bash
    groups: sudo
    append: yes
    state: present

- name: Налаштування привілеїв sudoers для devops та dev
  copy:
    dest: /etc/sudoers.d/devsecops-users
    content: |
      devops ALL=(ALL) NOPASSWD:ALL
      dev ALL=(ALL) NOPASSWD:ALL
    mode: '0440'
    validate: 'visudo -cf %s'

- name: Додавання авторизованого SSH-ключа для dev
  authorized_key:
    user: dev
    state: present
    key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIeuPOLsjjs2uLmyAomDlU4DRXdxyiT6yifwmNGoSrhT study3-devsecops"

- name: Додавання авторизованих SSH-ключів для devops
  authorized_key:
    user: devops
    state: present
    key: "{{ item }}"
  loop:
    - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIC9zCnHzYKXW4gpoW3/ud/MyBxpH9oFzWMCoBD9ksW/G"
    - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIeuPOLsjjs2uLmyAomDlU4DRXdxyiT6yifwmNGoSrhT study3-devsecops"
