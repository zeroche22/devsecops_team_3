---
# Базовий рівень безпеки Shift-Left (Hardening Baseline)

- name: Встановлення інструментів безпеки (ufw, fail2ban, unattended-upgrades)
  apt:
    name:
      - ufw
      - fail2ban
      - unattended-upgrades
    state: present

- name: Налаштування параметрів безпеки мережі через sysctl
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop:
    - { name: 'net.ipv4.tcp_syncookies', value: '1' }
    - { name: 'net.ipv4.conf.all.accept_redirects', value: '0' }
    - { name: 'net.ipv4.conf.default.accept_redirects', value: '0' }
    - { name: 'net.ipv4.conf.all.send_redirects', value: '0' }
    - { name: 'net.ipv4.conf.default.send_redirects', value: '0' }

- name: Налаштування списку виключень fail2ban (білий список підмереж)
  copy:
    dest: /etc/fail2ban/jail.local
    content: |
      [DEFAULT]
      ignoreip = 127.0.0.1/8 ::1 192.168.5.0/24 192.168.10.0/24 192.168.5.1
    mode: '0644'
    owner: root
    group: root

- name: Увімкнення та запуск служби fail2ban
  service:
    name: fail2ban
    state: restarted
    enabled: yes

- name: Налаштування політик UFW за замовчуванням
  ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: 'incoming', policy: 'deny' }
    - { direction: 'outgoing', policy: 'allow' }

- name: Дозвіл підключення по SSH у UFW
  ufw:
    rule: allow
    port: '22'
    proto: tcp

- name: Дозвіл трафіку для веб-додатку (HTTP) у UFW
  ufw:
    rule: allow
    port: '80'
    proto: tcp

- name: Дозвіл внутрішнього трафіку підмережі 192.168.5.0/24 у UFW
  ufw:
    rule: allow
    src: '192.168.5.0/24'

- name: Активація фаєрволу UFW
  ufw:
    state: enabled

# Блокування парольного входу SSH та захист облікових записів
- name: Блокування парольного входу для користувача student
  user:
    name: student
    password_lock: yes
  ignore_errors: yes

- name: Видалення конфліктуючих налаштувань хмарної ініціалізації SSH
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/ssh/sshd_config.d/50-cloud-init.conf
    - /etc/ssh/sshd_config.d/60-devsecops-hardening.conf

- name: Налаштування заборони парольної автентифікації SSH (пріоритетний файл 01-devsecops)
  copy:
    dest: /etc/ssh/sshd_config.d/01-devsecops-hardening.conf
    content: |
      # Shift-Left Security Hardening: сувора заборона входу за паролем
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      ChallengeResponseAuthentication no
      PermitRootLogin no
      PubkeyAuthentication yes
    mode: '0644'
    owner: root
    group: root

- name: Перезапуск служби SSH для застосування конфігурації
  service:
    name: ssh
    state: restarted
