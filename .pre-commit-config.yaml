repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: Gitleaks Secret Scan
        entry: gitleaks git --pre-commit --redact --staged --verbose
        language: system
        pass_filenames: false

      - id: terraform-fmt
        name: Terraform Format
        entry: terraform -chdir=terraform fmt -check -diff
        language: system
        files: ^terraform/.*\.tf$
        pass_filenames: false

      - id: terraform-validate
        name: Terraform Validate
        entry: bash -c 'terraform -chdir=terraform init -backend=false >/dev/null && terraform -chdir=terraform validate'
        language: system
        files: ^terraform/.*\.tf$
        pass_filenames: false

      - id: tflint
        name: TFLint
        entry: tflint --chdir=terraform
        language: system
        files: ^terraform/.*\.tf$
        pass_filenames: false

      - id: ansible-lint
        name: Ansible Lint
        entry: env ANSIBLE_ROLES_PATH=ansible/roles ansible-lint ansible/
        language: system
        files: ^ansible/.*\.(yml|yaml)$
        pass_filenames: false

      - id: hadolint
        name: Hadolint Dockerfile Scan
        entry: hadolint
        language: system
        files: Dockerfile$
